<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EU4Dialogue | დღე 1: AI საფუძვლები, საგრანტო ციკლი & პროექტების მართვა (ინტერაქტიული სლაიდები & პოსტ-კურს გაიდები)</title>
  <meta name="description" content="EU4Dialogue Civic AI & Project Management Bootcamp - დღე 1-ის სრული ინტერაქტიული საპრეზენტაციო სლაიდები (44 სლაიდი, 4 მოდული, 10 სამაგიდო გაიდი კურსის შემდგომი გამოყენებისთვის).">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/Loopple/FiraGO@1.0/cdn/FiraGO.css" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --brand-blue: #005a9c;
      --brand-blue-hover: #004d85;
      --brand-blue-light: rgba(0, 90, 156, 0.08);
      --pm-emerald: #059669;
      --pm-emerald-light: rgba(16, 185, 129, 0.1);
      --accent-purple: #7c3aed;
      --accent-purple-light: rgba(124, 58, 237, 0.1);
      --accent-amber: #d97706;
      --accent-amber-light: rgba(217, 119, 6, 0.1);
      
      --bg-canvas: #0f172a;
      --bg-slide: #ffffff;
      --bg-subtle: #f8fafc;
      --bg-card: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --text-light: #94a3b8;
      --border-subtle: #e2e8f0;
      --border-card: #cbd5e1;
      
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.06);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.12);
      --shadow-lg: 0 20px 40px rgba(0, 0, 0, 0.22);
      
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      
      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    body.night-mode {
      --bg-canvas: #020617;
      --bg-slide: #0b1329;
      --bg-subtle: #131d38;
      --bg-card: #182344;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-light: #64748b;
      --border-subtle: rgba(255, 255, 255, 0.1);
      --border-card: rgba(255, 255, 255, 0.16);
      --brand-blue: #38bdf8;
      --brand-blue-hover: #0284c7;
      --brand-blue-light: rgba(56, 189, 248, 0.15);
      --pm-emerald: #34d399;
      --pm-emerald-light: rgba(52, 211, 153, 0.15);
      --accent-purple: #c084fc;
      --accent-purple-light: rgba(192, 132, 252, 0.15);
    }

    body {
      font-family: 'FiraGO', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-main);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    /* TOP HEADER & CONTROLS */
    .deck-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 1000;
      color: #ffffff;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 0.92rem;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: #ffffff;
    }

    .header-logo span.badge {
      background: #005a9c;
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
    }

    .header-module-tag {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.18);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
      color: #cbd5e1;
      display: none;
    }

    @media (min-width: 768px) {
      .header-module-tag {
        display: inline-block;
      }
    }

    .header-center {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .slide-counter {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.95rem;
      transition: var(--transition);
      text-decoration: none;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    .ctrl-btn:active {
      transform: scale(0.96);
    }

    /* TOP PROGRESS BAR */
    .progress-bar-container {
      position: fixed;
      top: 60px;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255, 255, 255, 0.08);
      z-index: 999;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, #005a9c, #10b981, #7c3aed);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* VIEWPORT & STAGE */
    .stage {
      flex: 1;
      margin-top: 63px;
      margin-bottom: 70px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: calc(100vh - 133px);
    }

    .slide-viewport {
      width: 100%;
      max-width: 1180px;
      min-height: 640px;
      background: var(--bg-slide);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-subtle);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      animation: slideIn 0.35s ease;
      user-select: text;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(8px) scale(0.99);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* SLIDE INNER STRUCTURE */
    .slide-header {
      padding: 24px 36px 14px 36px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 20px;
      background: linear-gradient(180deg, var(--bg-subtle) 0%, transparent 100%);
    }

    .slide-meta-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .slide-pill {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 3px 10px;
      border-radius: 12px;
      background: var(--brand-blue-light);
      color: var(--brand-blue);
      border: 1px solid rgba(0, 90, 156, 0.2);
    }

    .slide-pill.green {
      background: var(--pm-emerald-light);
      color: var(--pm-emerald);
      border-color: rgba(16, 185, 129, 0.25);
    }

    .slide-pill.purple {
      background: var(--accent-purple-light);
      color: var(--accent-purple);
      border-color: rgba(124, 58, 237, 0.25);
    }

    .slide-pill.amber {
      background: var(--accent-amber-light);
      color: var(--accent-amber);
      border-color: rgba(217, 119, 6, 0.25);
    }

    .slide-timing {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .slide-title {
      font-size: clamp(1.35rem, 2.6vw, 1.85rem);
      font-weight: 900;
      color: var(--text-main);
      line-height: 1.25;
      letter-spacing: -0.015em;
    }

    .slide-subtitle {
      font-size: clamp(0.85rem, 1.4vw, 0.96rem);
      color: var(--text-muted);
      margin-top: 4px;
      line-height: 1.5;
    }

    .slide-badge-num {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      color: var(--brand-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      font-weight: 900;
      flex-shrink: 0;
    }

    .slide-body {
      flex: 1;
      padding: 26px 36px 32px 36px;
      overflow-y: auto;
      max-height: 650px;
    }

    /* GUIDE BANNER & CARDS (POST-COURSE PLAYBOOK) */
    .guide-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-radius: var(--radius-md);
      background: linear-gradient(90deg, rgba(0, 90, 156, 0.08) 0%, rgba(16, 185, 129, 0.08) 100%);
      border: 1px solid rgba(0, 90, 156, 0.25);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--brand-blue);
      margin-bottom: 18px;
    }

    body.night-mode .guide-banner {
      background: linear-gradient(90deg, rgba(56, 189, 248, 0.12) 0%, rgba(52, 211, 153, 0.12) 100%);
      border-color: rgba(56, 189, 248, 0.3);
      color: #38bdf8;
    }

    .guide-banner .guide-tag {
      background: #005a9c;
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    body.night-mode .guide-banner .guide-tag {
      background: #0284c7;
    }

    .guide-box {
      background: var(--bg-card);
      border: 1.5px solid rgba(0, 90, 156, 0.25);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: var(--transition);
      position: relative;
    }

    .guide-box:hover {
      border-color: var(--brand-blue);
      box-shadow: var(--shadow-md);
    }

    .guide-box-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .guide-step-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 12px;
    }

    .guide-step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: var(--brand-blue);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 800;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .guide-step-body {
      flex: 1;
      font-size: 0.85rem;
      line-height: 1.55;
      color: var(--text-main);
    }

    .guide-step-body strong {
      display: block;
      color: var(--text-main);
      margin-bottom: 2px;
      font-size: 0.88rem;
    }

    .checklist-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }

    .checklist-item {
      background: var(--bg-subtle);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      font-size: 0.82rem;
      line-height: 1.5;
    }

    .checklist-item .check-icon {
      color: var(--pm-emerald);
      font-weight: 900;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* GRID LAYOUTS INSIDE SLIDES */
    .grid-2col {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
    }

    .grid-3col {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }

    .grid-4col {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }

    /* CARDS & CONTAINERS INSIDE SLIDES */
    .card-box {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      position: relative;
      transition: var(--transition);
    }

    .card-box:hover {
      border-color: var(--brand-blue);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .card-box-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .card-icon {
      font-size: 1.35rem;
      line-height: 1;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.3;
    }

    .card-desc {
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .bullet-list {
      list-style: none;
      margin-top: 10px;
    }

    .bullet-list li {
      position: relative;
      padding-left: 20px;
      font-size: 0.86rem;
      color: var(--text-main);
      line-height: 1.55;
      margin-bottom: 8px;
    }

    .bullet-list li::before {
      content: "•";
      position: absolute;
      left: 4px;
      color: var(--brand-blue);
      font-size: 1.2rem;
      line-height: 1;
      top: 0;
    }

    .bullet-list li strong {
      color: var(--text-main);
    }

    /* HIGHLIGHT & CALLOUT BOXES */
    .callout-box {
      background: var(--bg-subtle);
      border-left: 4px solid var(--brand-blue);
      border-radius: 0 var(--radius-md) var(--radius-md) 0;
      padding: 14px 18px;
      margin: 14px 0;
      font-size: 0.88rem;
      line-height: 1.6;
      color: var(--text-main);
    }

    .callout-box.green {
      border-left-color: var(--pm-emerald);
      background: var(--pm-emerald-light);
    }

    .callout-box.purple {
      border-left-color: var(--accent-purple);
      background: var(--accent-purple-light);
    }

    .callout-box.amber {
      border-left-color: var(--accent-amber);
      background: var(--accent-amber-light);
    }

    /* PROMPT CODE BOX */
    .prompt-snippet {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: var(--radius-md);
      padding: 16px;
      margin: 14px 0;
      position: relative;
      color: #e2e8f0;
    }

    .prompt-snippet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid #1e293b;
      font-size: 0.75rem;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .prompt-copy-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--transition);
    }

    .prompt-copy-btn:hover {
      background: var(--pm-emerald);
      border-color: var(--pm-emerald);
    }

    .prompt-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      color: #cbd5e1;
    }

    /* SLIDO LIVE POLL MOCKUP */
    .slido-box {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.06) 0%, rgba(0, 90, 156, 0.08) 100%);
      border: 2px dashed rgba(16, 185, 129, 0.35);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin: 16px 0;
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .slido-qr-frame {
      width: 110px;
      height: 110px;
      background: #ffffff;
      border-radius: 12px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-subtle);
      box-shadow: var(--shadow-sm);
      flex-shrink: 0;
      text-align: center;
    }

    .slido-qr-code {
      width: 76px;
      height: 76px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
      margin-bottom: 4px;
    }

    .slido-qr-dot {
      background: #0f172a;
      border-radius: 2px;
    }

    .slido-qr-dot.accent {
      background: var(--pm-emerald);
    }

    .slido-content {
      flex: 1;
      min-width: 0;
    }

    .slido-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #10b981;
      color: #ffffff;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 0.74rem;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .slido-question {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 6px;
      line-height: 1.35;
    }

    .slido-options {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 10px;
    }

    .slido-option-item {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
    }

    /* WORKSHOP HANDS-ON CARD */
    .workshop-card {
      background: linear-gradient(180deg, rgba(0, 90, 156, 0.05) 0%, rgba(16, 185, 129, 0.05) 100%);
      border: 1.5px solid rgba(0, 90, 156, 0.25);
      border-radius: var(--radius-lg);
      padding: 22px;
      margin: 16px 0;
    }

    .workshop-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
    }

    .workshop-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--brand-blue);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .workshop-duration {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--text-muted);
      background: var(--bg-card);
      padding: 4px 10px;
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
    }

    /* STEP PIPELINE */
    .step-pipeline {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 16px 0;
      overflow-x: auto;
      padding-bottom: 4px;
    }

    .step-node {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      min-width: 170px;
      flex: 1;
      text-align: center;
    }

    .step-num {
      width: 24px;
      height: 24px;
      background: var(--brand-blue);
      color: #ffffff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.72rem;
      font-weight: 800;
      margin: 0 auto 6px auto;
    }

    .step-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .step-desc {
      font-size: 0.75rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .step-arrow {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 800;
      flex-shrink: 0;
    }

    /* TABLE IN SLIDES */
    .slide-table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin: 14px 0;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }

    .slide-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.84rem;
    }

    .slide-table th {
      background: var(--bg-subtle);
      padding: 12px 14px;
      font-weight: 800;
      color: var(--text-main);
      border-bottom: 1px solid var(--border-subtle);
      text-transform: uppercase;
      font-size: 0.74rem;
      letter-spacing: 0.04em;
    }

    .slide-table td {

            "content": "\n          <div class=\"grid-2col\">\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🎯</span>\n                <div>\n                  <div class=\"card-title\">CLEAR Framework (საოპერაციო ამოცანებისთვის)</div>\n                  <div style=\"font-size: 0.78rem; color: var(--brand-blue); font-weight: 800;\">Context • Limitation • Expectation • Action • Review</div>\n                </div>\n              </div>\n              <ul class=\"bullet-list\">\n                <li><strong>C - Context (კონტექსტი):</strong> ვინ ხართ, რა პროექტია, ვინ არის დონორი და რა არის სამიზნე თემი.</li>\n                <li><strong>L - Limitation (შეზღუდვები):</strong> სიტყვების ლიმიტი, აკრძალული ტერმინები, ბიუჯეტის ჩარჩო.</li>\n                <li><strong>E - Expectation (მოლოდინი):</strong> სასურველი ტონი (ოფიციალური, დიპლომატიური, ემპათიური).</li>\n                <li><strong>A - Action (კონკრეტული მოქმედება):</strong> \"შეადგინე 4-სვეტიანი Logframe\", \"გამოყავი 3 რისკი\".</li>\n                <li><strong>R - Review (კრიტიკა & გადამოწმება):</strong> \"გადაამოწმე შეესაბამება თუ არა EU გაიდლაინს\".</li>\n              </ul>\n            </div>\n\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🧩</span>\n                <div>\n                  <div class=\"card-title\">PARTS Framework (საგრანტო წერისთვის)</div>\n                  <div style=\"font-size: 0.78rem; color: var(--accent-purple); font-weight: 800;\">Persona • Audience • Recipe • Tone • Specifics</div>\n                </div>\n              </div>\n              <ul class=\"bullet-list\">\n                <li><strong>P - Persona (როლი):</strong> \"იმოქმედე როგორც EU საგრანტო პროგრამების წამყვანი ექსპერტი\".</li>\n                <li><strong>A - Audience (აუდიტორია):</strong> \"ტექსტი განკუთვნილია საგრანტო კომიტეტის შემფასებლებისთვის\".</li>\n                <li><strong>R - Recipe (სტრუქტურა/რეცეპტი):</strong> სათაური → პრობლემა → გადაწყვეტა → ინდიკატორი.</li>\n                <li><strong>T - Tone (ტონი):</strong> ობიექტური, მტკიცებულებებზე დაფუძნებული, Do No Harm.</li>\n                <li><strong>S - Specifics (სპეციფიკაციები):</strong> ცხრილის ფორმატი, SMART ფორმულირება.</li>\n              </ul>\n            </div>\n          </div>\n\n          <div class=\"callout-box purple\" style=\"margin-top: 14px;\">\n            ⚠️ <strong>მთავარი შეცდომა:</strong> მოკლე 1-წინადადებიანი პრომპტი (\"დამიწერე პროექტი\") იძლევა ბუნდოვან, უსარგებლო პასუხს. ხარისხიანი პრომპტი შეიცავს მინიმუმ 4-5 პარამეტრს!\n          </div>\n        "

            "content": "\n          <div class=\"guide-banner\">\n            <span class=\"guide-tag\">📘 პოსტ-კურს გაიდი</span>\n            <span>შეინახეთ ეს ჩეკლისტი Notion-ში ან დაბეჭდეთ მაგიდაზე: გადაამოწმეთ ყოველი ახალი პრომპტი გაგზავნამდე!</span>\n          </div>\n\n          <div class=\"grid-2col\">\n            <div class=\"guide-box\">\n              <div class=\"guide-box-header\">\n                <span class=\"card-icon\">📋</span>\n                <strong style=\"font-size: 0.95rem; color: var(--text-main);\">პრომპტის აგების 5 ოქროს ეტაპი</strong>\n              </div>\n              <div class=\"guide-step-row\">\n                <div class=\"guide-step-num\">1</div>\n                <div class=\"guide-step-body\">\n                  <strong>როლის განსაზღვრა (System Prompt)</strong>\n                  მიანიჭეთ მკაფიო ექსპერტული როლი: \"იმოქმედე როგორც EU4Dialogue/UNDP საგრანტო პროექტების მთავარი შემფასებელი.\"\n                </div>\n              </div>\n              <div class=\"guide-step-row\">\n                <div class=\"guide-step-num\">2</div>\n                <div class=\"guide-step-body\">\n                  <strong>სამიზნე აუდიტორიის დასახელება</strong>\n                  დააკონკრეტეთ, ვისთვის იწერება დოკუმენტი (დონორის ტექნიკური კომიტეტი, სათემო ბენეფიციარები თუ ფინანსური აუდიტორი).\n                </div>\n              </div>\n              <div class=\"guide-step-row\">\n                <div class=\"guide-step-num\">3</div>\n                <div class=\"guide-step-body\">\n                  <strong>უარყოფითი შეზღუდვები (Negative Constraints)</strong>\n                  უთხარით რა <em>არ</em> გააკეთოს: \"არ გამოიყენო ზედმეტად პათეტიკური ენა\", \"არ გადააჭარბო 300 სიტყვას\", \"არ ახსენო სახელები\".\n                </div>\n              </div>\n            </div>\n\n            <div class=\"guide-box\">\n              <div class=\"guide-box-header\">\n                <span class=\"card-icon\">⚡</span>\n                <strong style=\"font-size: 0.95rem; color: var(--text-main);\">მზა Master Prompt შაბლონი (Copy-Paste)</strong>\n              </div>\n              <div class=\"prompt-snippet\">\n                <div class=\"prompt-snippet-header\">\n                  <span>Grant Section Master Prompt</span>\n                  <button class=\"prompt-copy-btn\" onclick=\"copyPromptSnippet(this)\">კოპირება</button>\n                </div>\n                <div class=\"prompt-text\">როლი: EU/UNDP საგრანტო პროგრამების წამყვანი ექსპერტი.\nკონტექსტი: ჩვენ ვართ რეგიონული NGO, ვახორციელებთ პროექტს [პროექტის თემა] სამიზნე ჯგუფისთვის [ჯგუფი].\nამოცანა: შეადგინე საგრანტო განაცხადის სექცია: [სექციის სახელი, მაგ. Problem Justification].\nმოთხოვნები:\n1. გამოიყენე ობიექტური, მტკიცებულებებზე დაფუძნებული ტონი.\n2. ტექსტის მოცულობა: მაქსიმუმ 250-300 სიტყვა.\n3. დაიცავი Do No Harm პრინციპი.\n4. ბოლოს შეაფასე ტექსტი დონორის კრიტერიუმებით და მითხარი 1 გაუმჯობესების რეკომენდაცია.</div>\n              </div>\n            </div>\n          </div>\n        "

            "content": "\n          <div class=\"grid-2col\">\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🔄</span>\n                <div class=\"card-title\">Multi-Turn (დიალოგური დახვეწა)</div>\n              </div>\n              <p class=\"card-desc\">არასდროს მოელოდოთ სრულყოფილ შედეგს ერთ ნაბიჯში. პროფესიული დრაფტინგი არის 3-4 რაუნდიანი დიალოგი:</p>\n              <div style=\"margin-top: 12px; display: flex; flex-direction: column; gap: 8px;\">\n                <div style=\"background: var(--bg-subtle); padding: 8px 12px; border-radius: 6px; font-size: 0.82rem;\">\n                  <strong>რაუნდი 1:</strong> სტრუქტურისა და იდეების გენერირება (Outline).\n                </div>\n                <div style=\"background: var(--bg-subtle); padding: 8px 12px; border-radius: 6px; font-size: 0.82rem;\">\n                  <strong>რაუნდი 2:</strong> შერჩეული სექციის გაშლა და SMART ინდიკატორების მინიჭება.\n                </div>\n                <div style=\"background: var(--bg-subtle); padding: 8px 12px; border-radius: 6px; font-size: 0.82rem;\">\n                  <strong>რაუნდი 3:</strong> კრიტიკოსის როლი: \"იპოვე სუსტი წერტილები და შემომთავაზე გაუმჯობესება\".\n                </div>\n              </div>\n            </div>\n\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">📋</span>\n                <div class=\"card-title\">Few-Shot Prompting (მაგალითებით სწავლება)</div>\n              </div>\n              <p class=\"card-desc\">აჩვენეთ AI-ს 1-2 რეალური კარგი მაგალითი წარსულში მოგებული გრანტიდან:</p>\n              \n              <div class=\"prompt-snippet\" style=\"margin-top: 10px;\">\n                <div class=\"prompt-snippet-header\">\n                  <span>Few-Shot Prompt შაბლონი</span>\n                  <button class=\"prompt-copy-btn\" onclick=\"copyPromptSnippet(this)\">კოპირება</button>\n                </div>\n                <div class=\"prompt-text\">აი მაგალითი იმისა, თუ როგორ ვაყალიბებთ Outcome-ს:\nმაგალითი 1: \"სამიზნე თემში ახალგაზრდების 60%-ს აქვს გაუმჯობესებული წვდომა ციფრულ სერვისებზე...\"\nახლა ანალოგიური სტილითა და სიღრმით ჩამოაყალიბე ჩვენი ახალი პროექტის მე-2 Outcome:\n[პროექტის მონაცემები...]</div>\n              </div>\n            </div>\n          </div>\n        "

            "content": "\n          <div class=\"grid-2col\">\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🛡️</span>\n                <div class=\"card-title\">ჰალუცინაციის 3 მთავარი რისკი საგრანტო განაცხადში</div>\n              </div>\n              <ul class=\"bullet-list\">\n                <li><strong>გამოგონილი კვლევები და ციტირებები:</strong> LLM-ები ხშირად აგენერირებენ არარსებულ ავტორებს, წლებს ან საერთაშორისო ორგანიზაციების რეპორტების ნომრებს.</li>\n                <li><strong>გადაჭარბებული ან დაუდასტურებელი სტატისტიკა:</strong> სამიზნე თემის საჭიროებების (Needs Assessment) აღწერისას მცდარი პროცენტების გამოყენება.</li>\n                <li><strong>დონორის მოთხოვნების \"შელამაზება\":</strong> შეუსაბამო დაპირებები, რომლებიც ორგანიზაციას შემდგომ მონიტორინგსა და აუდიტში პრობლემებს შეუქმნის.</li>\n              </ul>\n              <div class=\"callout-box amber\" style=\"margin-top: 14px; margin-bottom: 0;\">\n                ⚖️ <strong>ოქროს წესი:</strong> \"Trust, but Verify\" - არასდროს ჩასვათ საგრანტო დოკუმენტში ციფრი ან წყარო, რომლის პირველწყაროც საკუთარი თვალით არ გადაგიმოწმებიათ!\n              </div>\n            </div>\n\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🔍</span>\n                <div class=\"card-title\">Grounding ტექნიკა & ვერიფიკაციის პრომპტი</div>\n              </div>\n              <p class=\"card-desc\">გამოიყენეთ წყაროზე მიბმული (Grounded) მოდელები (NotebookLM, Perplexity) ან ჩაუტარეთ დრაფტს ფაქტ-ჩექინგის აუდიტი:</p>\n\n              <div class=\"prompt-snippet\" style=\"margin-top: 10px;\">\n                <div class=\"prompt-snippet-header\">\n                  <span>Fact-Checking & Hallucination Audit Prompt</span>\n                  <button class=\"prompt-copy-btn\" onclick=\"copyPromptSnippet(this)\">კოპირება</button>\n                </div>\n                <div class=\"prompt-text\">იმოქმედე როგორც დონორის მკაცრი ტექნიკური აუდიტორი.\nგააანალიზე ეს საგრანტო ტექსტი და გამოავლინე:\n1. ყველა ფაქტობრივი მტკიცება, ციფრი და სტატისტიკა, რომელიც მოითხოვს პირველწყაროს მითითებას.\n2. ნებისმიერი პოტენციურად გადაჭარბებული ან დაუსაბუთებელი დაპირება.\n3. მონიშნე წინადადებები, რომლებიც ჟღერს როგორც ტიპური გენერაციული AI ჰალუცინაცია და შემომთავაზე მათი გადამოწმებადი ალტერნატივა:\n[ჩასვით ტექსტი]</div>\n              </div>\n            </div>\n          </div>\n        "

  <div class=\"prompt-text\">ჩვენ ვართ არასამთავრობო ორგანიზაცია, რომელიც მუშაობს სამოქალაქო ჩართულობაზე, სათემო დიალოგსა და მშვიდობის მშენებლობაზე სამხრეთ კავკასიაში.\nძირითადი დონორები: EU, UNDP და საერთაშორისო ფონდები.\nყოველთვის დაიცავი შემდეგი წესები:\n1. ტონი: ობიექტური, მტკიცებულებებზე დაფუძნებული, კონსტრუქციული და დიპლომატიური.\n2. ეთიკა: Do No Harm პრინციპი, კონფლიქტისადმი მგრძნობელობა, გენდერული თანასწორობა.\n3. აკრძალულია: ზედმეტად პათეტიკური ლოზუნგები, გადაუმოწმებელი სტატისტიკა და მარკეტინგული კლიშეები.\n4. ფორმატირება: მკაფიო სათაურები, ბულეტები, Markdown ცხრილები.</div>\n              </div>\n              <div class=\"callout-box purple\" style=\"margin-top: 10px; margin-bottom: 0;\">\n                💡 <strong>გუნდის რუტინა:</strong> შეინახეთ ეს შაბლონი Notion-ში და გაუზიარეთ ყველა თანამშრომელს პირველივე დღეს!\n              </div>\n            </div>\n          </div>\n        "

            "content": "\n          <div class=\"grid-2col\">\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🗺️</span>\n                <div class=\"card-title\">Mendelow-ს Power-Interest მატრიცა სამოქალაქო სექტორში</div>\n              </div>\n              <p class=\"card-desc\">დონორები განსაკუთრებულ ყურადღებას აქცევენ იმას, თუ რამდენად ზუსტად იცნობს განმცხადებელი ადგილობრივ კონტექსტს და ვისზე ახდენს გავლენას პროექტი:</p>\n              <ul class=\"bullet-list\" style=\"margin-top: 10px;\">\n                <li><strong>High Power / High Interest (საკვანძო მოთამაშეები):</strong> ადგილობრივი თვითმმართველობა, თემის ლიდერები: მჭიდრო პარტნიორობა და თანაშემოქმედება.</li>\n                <li><strong>High Power / Low Interest (კმაყოფილების შენარჩუნება):</strong> რეგიონული სამთავრობო სტრუქტურები, მარეგულირებლები: რეგულარული ინფორმირება.</li>\n                <li><strong>Low Power / High Interest (მთავარი მოკავშირეები):</strong> ადგილობრივი აქტივისტები, ახალგაზრდული ჯგუფები, ბენეფიციარები: აქტიური ჩართულობა.</li>\n                <li><strong>Low Power / Low Interest (მონიტორინგი):</strong> ფართო საზოგადოება: მინიმალური კომუნიკაცია, საინფორმაციო ბიულეტენები.</li>\n              </ul>\n            </div>\n\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">💡</span>\n                <div class=\"card-title\">სათემო საჭიროებების გამოვლენა & AI პრომპტი</div>\n              </div>\n              <p class=\"card-desc\">როგორ აღმოვაჩინოთ \"უხილავი\" დაინტერესებული მხარეები და მოწყვლადი ჯგუფები Do No Harm პრინციპით:</p>\n\n              <div class=\"prompt-snippet\" style=\"margin-top: 10px;\">\n                <div class=\"prompt-snippet-header\">\n                  <span>Stakeholder Analysis & Engagement Prompt</span>\n                  <button class=\"prompt-copy-btn\" onclick=\"copyPromptSnippet(this)\">კოპირება</button>\n                </div>\n                <div class=\"prompt-text\">იმოქმედე როგორც სათემო განვითარებისა და სამოქალაქო დიალოგის ექსპერტი.\nპროექტის თემა და ლოკაცია: [ჩასვით თემა და სამიზნე რეგიონი]\nშეადგინე დაინტერესებულ მხარეთა (Stakeholders) სრული რუკა:\n1. დააჯგუფე Mendelow-ს მატრიცის 4 კვადრანტში (Power vs. Interest).\n2. გამოავლინე მინიმუმ 2 მოწყვლადი ან ხშირად უგულებელყოფილი ჯგუფი (შშმ პირები, ეთნიკური უმცირესობები, იძულებით გადაადგილებული პირები).\n3. თითოეულ ჯგუფზე შემომთავაზე ჩართულობის (Engagement) კონკრეტული Do No Harm მეთოდი.</div>\n              </div>\n              <div class=\"callout-box purple\" style=\"margin-top: 10px; margin-bottom: 0;\">\n                🛡️ <strong>Do No Harm ფილტრი:</strong> ჩართულობის დაგეგმვისას დარწმუნდით, რომ პროექტში მონაწილეობა საფრთხეს არ შეუქმნის მოწყვლად ბენეფიციარებს ადგილზე.\n              </div>\n            </div>\n          </div>\n        "

            "content": "\n          <div class=\"grid-2col\">\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🌳</span>\n                <div class=\"card-title\">Problem Tree vs. Objectives Tree</div>\n              </div>\n              <p class=\"card-desc\">EU და UNDP პროექტებში Logframe-ის აგებამდე აუცილებელია სიღრმისეული მიზეზ-შედეგობრივი ანალიზი:</p>\n              <div class=\"step-pipeline\" style=\"flex-direction: column; gap: 8px; margin-top: 10px;\">\n                <div style=\"background: rgba(239, 68, 68, 0.08); padding: 8px 12px; border-radius: 6px; border-left: 4px solid #ef4444; width: 100%;\">\n                  <strong>1. ფესვური მიზეზები (Roots):</strong> რატომ არსებობს პრობლემა? (სოციალური, ეკონომიკური, ინსტიტუციური ბარიერები).\n                </div>\n                <div style=\"background: rgba(217, 119, 6, 0.08); padding: 8px 12px; border-radius: 6px; border-left: 4px solid #d97706; width: 100%;\">\n                  <strong>2. მთავარი პრობლემა (Trunk):</strong> საკვანძო სათემო გამოწვევა, რომელსაც პროექტი უშუალოდ ეხმიანება.\n                </div>\n                <div style=\"background: rgba(16, 185, 129, 0.08); padding: 8px 12px; border-radius: 6px; border-left: 4px solid #10b981; width: 100%;\">\n                  <strong>3. ნეგატიური შედეგები (Branches):</strong> როგორ აისახება ეს პრობლემა სამიზნე ჯგუფის ყოველდღიურ ცხოვრებაზე?\n                </div>\n              </div>\n              <div class=\"callout-box green\" style=\"margin-top: 12px; margin-bottom: 0;\">\n                🔄 <strong>გარდაქმნის ფორმულა:</strong> ფესვები გარდაიქმნება პროექტის აქტივობებად (Activities), მთავარი პრობლემა: პროექტის შედეგად (Outcome), ხოლო შედეგები: გრძელვადიან გავლენად (Impact).\n              </div>\n            </div>\n\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">⚡</span>\n                <div class=\"card-title\">Problem-to-Objective AI Converter</div>\n              </div>\n              <p class=\"card-desc\">მიაწოდეთ AI-ს სათემო პრობლემის მოკლე აღწერა და მიიღეთ მზა იერარქია:</p>\n\n              <div class=\"prompt-snippet\" style=\"margin-top: 10px;\">\n                <div class=\"prompt-snippet-header\">\n                  <span>Problem Tree to Objectives Tree Prompt</span>\n                  <button class=\"prompt-copy-btn\" onclick=\"copyPromptSnippet(this)\">კოპირება</button>\n                </div>\n                <div class=\"prompt-text\">იმოქმედე როგორც საგრანტო პროექტების მეთოდოლოგი.\nსათემო პრობლემა: [აღწერეთ პრობლემა მოკლედ]\nშეასრულე შემდეგი ამოცანა:\n1. გამოიყენე \"5 Whys\" მეთოდი და ჩამოაყალიბე პრობლემის 3 ფესვური მიზეზი (Root Causes).\n2. ააგე სრული პრობლემის ხე (Problem Tree: Causes → Core Problem → Effects).\n3. გარდაქმენი პრობლემის ხე მიზნების ხედ (Objectives Tree: Activities → Outputs → Outcomes → Impact).\n4. შეამოწმე, რომ ყოველი უარყოფითი ფორმულირება პოზიტიურ, მიღწევად ცვლილებად გარდაიქმნას.</div>\n              </div>\n            </div>\n          </div>\n        "

            "content": "\n          <div class=\"grid-2col\">\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">💡</span>\n                <div class=\"card-title\">SCAMPER ჩარჩო სამოქალაქო ინოვაციებისთვის</div>\n              </div>\n              <ul class=\"bullet-list\" style=\"font-size: 0.84rem;\">\n                <li><strong>S - Substitute:</strong> რა შეგვიძლია ჩავანაცვლოთ არსებულ მიდგომაში?</li>\n                <li><strong>C - Combine:</strong> რა სხვა ინიციატივებთან შეგვიძლია გავაერთიანოთ?</li>\n                <li><strong>A - Adapt:</strong> რა საერთაშორისო პრაქტიკა შეგვიძლია მოვარგოთ ადგილობრივ თემს?</li>\n                <li><strong>M - Modify / Magnify:</strong> რომელი კომპონენტის გაძლიერება მოიტანს გარდამტეხ ეფექტს?</li>\n                <li><strong>P - Put to another use:</strong> როგორ გამოვიყენოთ არსებული რესურსი ახალი მიზნით?</li>\n                <li><strong>E - Eliminate:</strong> რა ზედმეტი ბიუროკრატიული ეტაპი შეგვიძლია ამოვიღოთ?</li>\n                <li><strong>R - Reverse:</strong> როგორ წარიმართება პროექტი, თუ პროცესს პირიქით დავიწყებთ?</li>\n              </ul>\n            </div>\n\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🎨</span>\n                <div class=\"card-title\">Miro AI (Innovation Workspace) ფუნქციები</div>\n              </div>\n              <ul class=\"bullet-list\">\n                <li><strong>Sticky Notes Auto-Cluster:</strong> ასობით სათემო იდეის ავტომატური დაჯგუფება თემატურ კლასტერებად.</li>\n                <li><strong>Mind Map Expansion:</strong> ერთი საწყისი იდეიდან სრული პრობლემის ხის (Problem Tree) აგება.</li>\n                <li><strong>Miro Sidekicks:</strong> AI ასისტენტები (მაგ. Devil's Advocate, Facilitator), რომლებიც სვამენ კრიტიკულ შეკითხვებს.</li>\n                <li><strong>პირდაპირი ექსპორტი Notion-ში:</strong> ვიზუალური იდეების გადატანა ს             "content": "\n          <div class=\"grid-2col\">\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🔗</span>\n                <div class=\"card-title\">Logframe vs. Theory of Change</div>\n              </div>\n              <ul class=\"bullet-list\">\n                <li><strong>Logframe:</strong> ხაზოვანი, ოპერატიული მართვის ინსტრუმენტი (რა აქტივობას რა Output მოსდევს). დონორისთვის ხელშეკრულების საფუძველია.</li>\n                <li><strong>Theory of Change:</strong> სტრატეგიული, სისტემური რუკა (რატომ და როგორ ხდება ცვლილება). მოიცავს მიზეზ-შედეგობრივ კავშირებს და ფარულ დაშვებებს.</li>\n                <li><strong>სინერგია:</strong> ToC არის ფილოსოფია და სტრატეგია; Logframe არის მისი აღსრულების გეგმა.</li>\n              </ul>\n            </div>\n\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🪜</span>\n                <div class=\"card-title\">ToC-ის მიზეზ-შედეგობრივი ჯაჭვი (Causal Pathway)</div>\n              </div>\n              <div class=\"step-pipeline\" style=\"flex-direction: column; gap: 8px;\">\n                <div style=\"background: var(--bg-card); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-subtle); width: 100%;\">\n                  <strong>თუ (If):</strong> ჩავატარებთ AI და პროექტების მართვის პრაქტიკულ ბუთქემფს NGO-ებისთვის...\n                </div>\n                <div style=\"background: var(--bg-card); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-subtle); width: 100%;\">\n                  <strong>მაშინ (Then):</strong> ორგანიზაციები დაზოგავენ დროს ადმინისტრირებაზე და გაზრდიან საგრანტო ხარისხს...\n                </div>\n                <div style=\"background: var(--bg-card); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border-subtle); width: 100%;\">\n                  <strong>რადგან (Because):</strong> heory of Change):\n[ჩასვით თქვენი ToC ჯაჭვი]\nშეაფასე შემდეგი კრიტერიუმებით:\n1. არის თუ არა მიზეზ-შედეგობრივი კავშირები ლოგიკური და დამაჯერებელი?\n2. რა ფარული დაშვებები გვაქვს გამოტოვებული?\n3. სად შეიძლება გაწყდეს ჯაჭვი რეალურ საველე პირობებში?\n4. შემომთავაზე 3 გაუმჯობესებული ფორმულირება.</div>\n              </div>\n            </div>\n          </div>\n        "

            "content": "\n          <div class=\"grid-2col\">\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">📑</span>\n                <div class=\"card-title\">რატომ იწუნებენ საგრანტო განაცხადებს პირველივე ეტაპზე?</div>\n              </div>\n              <ul class=\"bullet-list\">\n                <li><strong>ფორმალური შეუსაბამობა (Administrative Ineligibility):</strong> არასწორი ფონტი, გვერდების ლიმიტის გადაჭარბება, გამოტოვებული სავალდებულო დანართი.</li>\n                <li><strong>არასწორი აქცენტები ქულების სისტემაში (Scoring Rubric):</strong> განმცხადებელი დიდ დროს უთმობს დაბალქულიან სექციას და აკლდება ქულები მთავარ კრიტერიუმში.</li>\n                <li><strong>შეუსაბამო ხარჯები (Ineligible Costs):</strong> ბიუჯეტში აკრძალული პუნქტების შეტანა, რაც იწვევს განაცხადის ავტომატურ დისკვალიფიკაციას.</li>\n                <li><strong>სავალდებულო ჰორიზონტალური პრიორიტეტების გამოტოვება:</strong> გენდერული თანასწორობისა და მწვანე ტრანსფორმაციის მოთხოვნების უგულებელყოფა.</li>\n              </ul>\n              <div class=\"callout-box blue\" style=\"margin-top: 14px; margin-bottom: 0;\">\n                ⚡ <strong>სისწრაფის ეფექტი:</strong> 50-გვერდიანი ტექნიკური დოკუმენტის კითხვა და ანალიზი 4-5 საათის ნაცვლად სრულდება 5-10 წუთში!\n              </div>\n            </div>\n\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">🔍</span>\n                <div class=\"card-title\">AI Guidelines Deconstructor & Compliance Prompt</div>\n              </div>\n              <p class=\"card-desc\">ატვირთეთ Call for Proposals PDF ფაილი Claude-ში ან Gemini-ში და გაუშვით შემდეგი პრომპტი:</p>\n\n              <div class=\"prompt-snippet\" style=\"margin-top: 10px;\">\n                <div class=\"prompt-snippet-header\">\n                  <span>Donor Guidelines Deconstruction Prompt</span>\n                  <button class=\"prompt-copy-btn\" onclick=\"copyPromptSnippet(this)\">კოპირება</button>\n                </div>\n                <div class=\"prompt-text\">იმოქმედე როგორც საგრანტო აუდიტის მთავარი ექსპერტი.\nწაიკითხე თანდართული დონორის გაიდლაინი (Call for Proposals) და შეადგინე ცხრილი:\n1. განმცხადებლის უფლებამოსილების (Eligibility) მკაცრი კრიტერიუმები.\n2. შეფასების კრიტერიუმები (Scoring Rubric) და ქულების მაქსიმალური განაწილება.\n3. აკრძალული და არაუფლებამოსილი ხარჯები ბიუჯეტისთვის.\n4. სავალდებულო დანართებისა და ფორმატების ჩეკლისტი.\n5. ტოპ 3 ფაქტორი, რის გამოც დონორმა შეიძლება ეს განაცხადი პირველივე ეტაპზე დაიწუნოს.</div>\n              </div>\n            </div>\n          </div>\n        "

            "content": "\n          <div class=\"grid-2col\">\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">⚡</span>\n                <div class=\"card-title\">სად იკარგება გუნდის ენერგია შეხვედრების შემდეგ?</div>\n              </div>\n              <p class=\"card-desc\">არასამთავრობო ორგანიზაციებში უამრავი დრო იხარჯება შეხვედრების ჩანიშვნაზე, ოქმების შედგენასა და დავალებების განაწილებაზე:</p>\n              <ul class=\"bullet-list\" style=\"margin-top: 10px;\">\n                <li><strong>დაკარგული შეთანხმებები:</strong> შეხვედრაზე გაჟღერებული კარგი იდეები ხშირად რჩება ჰაერში და არ გადადის კონკრეტულ მოქმედებაში.</li>\n                <li><strong>ბუნდოვანი პასუხისმგებლობები:</strong> როცა არ წერია \"ვინ, რას აკეთებს და რა ვადაში\", პროექტის დედლაინები ირღვევა.</li>\n                <li><strong>AI შეხვედრის რეზიუმე:</strong> სწრაფი ჩანაწერების ან ტრანსკრიპტის გარდაქმნა მკაფიო Action Items ცხრილად.</li>\n                <li><strong>პირდაპირი სინქრონიზაცია Notion-ში:</strong> მიღებული ცხრილი ერთი დაკლიკებით იქცევა Kanban დაფის ბარათებად.</li>\n              </ul>\n            </div>\n\n            <div class=\"card-box\">\n              <div class=\"card-box-header\">\n                <span class=\"card-icon\">📋</span>\n                <div class=\"card-title\">Meeting Minutes to Tasks Converter Prompt</div>\n              </div>\n              <p class=\"card-desc\">ჩასვით შეხვედრის ნებისმიერი უსისტემო ჩანაწერი და მიიღეთ მზა საოპერაციო ოქმი:</p>\n\n              <div class=\"prompt-snippet\" style=\"margin-top: 10px;\">\n                <div class=\"prompt-snippet-header\">\n                  <span>Meeting Minutes & Action Items Extractor</span>\n                  <button class=\"prompt-copy-btn\" onclick=\"copyPromptSnippet(this)\">კოპირება</button>\n                </div>\n                <div class=\"prompt-text\">იმოქმედე როგორც პროექტების საოპერაციო მენეჯერი.\nაი ჩვენი სამუშაო შეხვედრის მოკლე ჩანაწერები / ტრანსკრიპტი:\n[ჩასვით შეხვედრის ჩანაწერები]\nშეადგინე სტრუქტურირებული ოქმი:\n1. საკვანძო გადაწყვეტილებების შეჯამება (Key Decisions, მაქს. 3-4 პუნქტი).\n2. კონკრეტული დავალებების ცხრილი Markdown-ში:\n   - დავალების დასახელება (Action Item)\n   - პასუხისმგებელი პირი (Assignee)\n   - შესრულების ვადა (Deadline)\n   - პრიორიტეტი (High / Medium / Low)\n3. შემდეგი შეხვედრის თარიღი და დღის წესრიგი.</div>\n              </div>\n              <div class=\"callout-box green\" style=\"margin-top: 10px; margin-bottom: 0;\">\n                🚀 <strong>შედეგი:</strong> შეხვედრის დასრულებიდან 2 წუთში მთელ გუნდს ელექტრონულ ფოსტასა და Notion-ში აქვს მზა, სტრუქტურირებული სამოქმედო გეგმა!\n              </div>\n            </div>\n          </div>\n        "

    let currentSlide = 0;

    function renderSlide(index) {
      if (index < 0 || index >= slidesData.length) return;
      currentSlide = index;

      const slide = slidesData[index];
      const viewport = document.getElementById('slideViewport');

      // Update Header & Progress
      document.getElementById('slideCounter').textContent = `სლაიდი ${index + 1} / ${slidesData.length}`;
      document.getElementById('headerModuleTag').textContent = slide.module;
      const progressPercent = ((index + 1) / slidesData.length) * 100;
      document.getElementById('progressBar').style.width = `${progressPercent}%`;

      // Update Nav Buttons
      document.getElementById('prevBtn').disabled = (index === 0);
      document.getElementById('nextBtn').disabled = (index === slidesData.length - 1);
      document.getElementById('nextBtn').textContent = (index === slidesData.length - 1) ? 'დასრულება ✓' : 'შემდეგი →';

      // Render HTML into viewport
      viewport.innerHTML = `
        <div class="slide-header">
          <div>
            <div class="slide-meta-row">
              <span class="slide-pill ${slide.pillClass}">${slide.pill}</span>
              <span class="slide-timing">⏱️ ${slide.timing}</span>
            </div>
            <h1 class="slide-title">${slide.title}</h1>
            <p class="slide-subtitle">${slide.subtitle}</p>
          </div>
          <div class="slide-badge-num">${String(index + 1).padStart(2, '0')}</div>
        </div>
        <div class="slide-body">
          ${slide.content}
        </div>
      `;

      // Update Overview active state if drawer is open
      updateOverviewSelection();
    }

    function nextSlide() {
      if (currentSlide < slidesData.length - 1) {
        renderSlide(currentSlide + 1);
      }
    }

    function prevSlide() {
      if (currentSlide > 0) {
        renderSlide(currentSlide - 1);
      }
    }

    function goToSlide(index) {
      renderSlide(index);
      toggleOverview(false);
    }

    // Keyboard Navigation
    document.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'Home') {
        e.preventDefault();
        renderSlide(0);
      } else if (e.key === 'End') {
        e.preventDefault();
        renderSlide(slidesData.length - 1);
      } else if (e.key === 'o' || e.key === 'O') {
        toggleOverview();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 'Escape') {
        toggleOverview(false);
      }
    });

    // Touch swipe support for mobile
    let touchStartX = 0;
    let touchEndX = 0;
    document.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    document.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const diff = touchEndX - touchStartX;
      if (diff < -50) {
        nextSlide();
      } else if (diff > 50) {
        prevSlide();
      }
    }

    // Theme Toggle
    function toggleTheme() {
      document.body.classList.toggle('night-mode');
      const isNight = document.body.classList.contains('night-mode');
      try { localStorage.setItem('eu4d-deck-theme', isNight ? 'night' : 'day'); } catch (e) {}
    }

    (function() {
      let saved = null;
      try { saved = localStorage.getItem('eu4d-deck-theme'); } catch (e) {}
      if (saved === 'night') {
        document.body.classList.add('night-mode');
      }
    })();

    // Fullscreen Toggle
    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    // Overview Drawer
    function toggleOverview(forceState) {
      const drawer = document.getElementById('overviewDrawer');
      const isOpen = drawer.classList.contains('active');
      const shouldOpen = (forceState !== undefined) ? forceState : !isOpen;

      if (shouldOpen) {
        buildOverviewGrid();
        drawer.classList.add('active');
      } else {
        drawer.classList.remove('active');
      }
    }

    function buildOverviewGrid() {
      const grid = document.getElementById('overviewGrid');
      grid.innerHTML = '';
      slidesData.forEach((s, idx) => {
        const item = document.createElement('div');
        item.className = `overview-item ${idx === currentSlide ? 'current' : ''}`;

        item.innerHTML = `
          <div>
            <div class="overview-item-num">სლაიდი ${idx + 1} • ${s.timing}</div>
            <div class="overview-item-title">${s.title}</div>
          </div>
          <div class="overview-item-mod">${s.module}</div>
        `;
        grid.appendChild(item);
      });
    }

    function updateOverviewSelection() {
      const items = document.querySelectorAll('.overview-item');
      items.forEach((it, idx) => {
        if (idx === currentSlide) {
          it.classList.add('current');
        } else {
          it.classList.remove('current');
        }
      });
    }

    // Prompt Copy Helper
    function copyPromptSnippet(btn) {
      const snippet = btn.closest('.prompt-snippet').querySelector('.prompt-text');
      if (!snippet) return;
      navigator.clipboard.writeText(snippet.innerText.trim()).then(() => {
        const orig = btn.innerText;
        btn.innerText = '✓ კოპირებულია';
        btn.style.background = '#10b981';
        setTimeout(() => {
          btn.innerText = orig;
          btn.style.background = '';
        }, 2000);
      });
    }

    // Initialize slide deck on load
    document.addEventListener('DOMContentLoaded', () => {
      renderSlide(0);
    });
  </script>
</body>
</html>
