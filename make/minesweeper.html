<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Minesweeper</title>
    <style>
        :root {
            --bg-color: #c0c0c0;
            --border-light: #ffffff;
            --border-dark: #808080;
            --mine-red: #ff0000;
        }
        body {
            background-color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
            user-select: none;
        }
        #game-container {
            background-color: var(--bg-color);
            padding: 10px;
            border: 3px solid;
            border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
        }
        #difficulty-selector {
            margin-bottom: 10px;
            display: flex;
            gap: 5px;
        }
        button.diff-btn {
            background: var(--bg-color);
            border: 2px solid;
            border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
            padding: 2px 8px;
            cursor: pointer;
            font-size: 12px;
        }
        button.diff-btn:active {
            border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
        }
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px;
            border: 3px solid;
            border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
            margin-bottom: 10px;
        }
        .lcd {
            background-color: #000;
            color: #ff0000;
            font-size: 24px;
            padding: 2px 5px;
            width: 50px;
            text-align: center;
            border: 2px solid;
            border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
        }
        #reset-btn {
            width: 30px;
            height: 30px;
            font-size: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: 2px solid;
            border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
        }
        #reset-btn:active {
            border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
        }
        #board {
            display: grid;
            border: 3px solid;
            border-color: var(--border-dark) var(--border-light) var(--border-light) var(--border-dark);
        }
        .cell {
            width: 25px;
            height: 25px;
            border: 2px solid;
            border-color: var(--border-light) var(--border-dark) var(--border-dark) var(--border-light);
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
        }
        .cell.revealed {
            border: 1px solid var(--border-dark);
            background-color: var(--bg-color);
        }
        .cell.mine { background-color: var(--mine-red); }
        .cell[data-val="1"] { color: blue; }
        .cell[data-val="2"] { color: green; }
        .cell[data-val="3"] { color: red; }
        .cell[data-val="4"] { color: darkblue; }
        .cell[data-val="5"] { color: darkred; }
        .cell[data-val="6"] { color: teal; }
        .cell[data-val="7"] { color: black; }
        .cell[data-val="8"] { color: gray; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="difficulty-selector">
        <button class="diff-btn" onclick="initGame('beginner')">Beginner</button>
        <button class="diff-btn" onclick="initGame('intermediate')">Intermediate</button>
        <button class="diff-btn" onclick="initGame('expert')">Expert</button>
    </div>
    
    <div id="header">
        <div id="mine-count" class="lcd">010</div>
        <div id="reset-btn" onclick="reset()">🙂</div>
        <div id="timer" class="lcd">000</div>
    </div>
    
    <div id="board"></div>
</div>

<script>
    const CONFIG = {
        beginner: { rows: 9, cols: 9, mines: 10 },
        intermediate: { rows: 16, cols: 16, mines: 40 },
        expert: { rows: 16, cols: 30, mines: 99 }
    };

    let currentDiff = 'beginner';
    let board = [];
    let minePositions = [];
    let revealedCount = 0;
    let flags = 0;
    let timer = 0;
    let timerInterval = null;
    let gameStatus = 'ready'; // ready, playing, won, lost

    const boardEl = document.getElementById('board');
    const mineCountEl = document.getElementById('mine-count');
    const timerEl = document.getElementById('timer');
    const resetBtn = document.getElementById('reset-btn');

    function initGame(difficulty) {
        currentDiff = difficulty;
        const { rows, cols, mines } = CONFIG[difficulty];
        
        // Reset state
        clearInterval(timerInterval);
        timer = 0;
        gameStatus = 'ready';
        revealedCount = 0;
        flags = 0;
        updateLCD(timerEl, 0);
        updateLCD(mineCountEl, mines);
        resetBtn.innerText = '🙂';
        
        boardEl.style.gridTemplateColumns = `repeat(${cols}, 25px)`;
        boardEl.style.gridTemplateRows = `repeat(${rows}, 25px)`;
        boardEl.innerHTML = '';
        
        board = [];
        for (let r = 0; r < rows; r++) {
            board[r] = [];
            for (let c = 0; c < cols; c++) {
                const cell = {
                    r, c,
                    isMine: false,
                    isRevealed: false,
                    isFlagged: false,
                    neighborMines: 0,
                    el: document.createElement('div')
                };
                cell.el.className = 'cell';
                cell.el.onmousedown = (e) => handleCellClick(e, cell);
                cell.el.oncontextmenu = (e) => e.preventDefault();
                boardEl.appendChild(cell.el);
                board[r][c] = cell;
            }
        }
    }

    function handleCellClick(e, cell) {
        if (gameStatus === 'won' || gameStatus === 'lost') return;

        if (e.button === 2) { // Right click
            toggleFlag(cell);
            return;
        }

        if (cell.isFlagged || cell.isRevealed) return;

        if (gameStatus === 'ready') {
            startGame(cell);
        }

        revealCell(cell);
    }

    function startGame(firstCell) {
        gameStatus = 'playing';
        placeMines(firstCell);
        calculateNeighbors();
        startTimer();
    }

    function placeMines(safeCell) {
        const { rows, cols, mines } = CONFIG[currentDiff];
        minePositions = [];
        let placed = 0;
        while (placed < mines) {
            const r = Math.floor(Math.random() * rows);
            const c = Math.floor(Math.random() * cols);
            if (!board[r][c].isMine && (r !== safeCell.r || c !== safeCell.c)) {
                board[r][c].isMine = true;
                minePositions.push({r, c});
                placed++;
            }
        }
    }

    function calculateNeighbors() {
        const { rows, cols } = CONFIG[currentDiff];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (board[r][c].isMine) continue;
                let count = 0;
                for (let dr = -1; dr <= 1; dr++) {
                    for (let dc = -1; dc <= 1; dc++) {
                        const nr = r + dr, nc = c + dc;
                        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && board[nr][nc].isMine) count++;
                    }
                }
                board[r][c].neighborMines = count;
            }
        }
    }

    function revealCell(cell) {
        if (cell.isRevealed || cell.isFlagged) return;

        cell.isRevealed = true;
        cell.el.classList.add('revealed');
        revealedCount++;

        if (cell.isMine) {
            gameOver();
            return;
        }

        if (cell.neighborMines > 0) {
            cell.el.innerText = cell.neighborMines;
            cell.el.setAttribute('data-val', cell.neighborMines);
        } else {
            // Flood fill
            const { rows, cols } = CONFIG[currentDiff];
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    const nr = cell.r + dr, nc = cell.c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
                        revealCell(board[nr][nc]);
                    }
                }
            }
        }

        checkWin();
    }

    function toggleFlag(cell) {
        if (cell.isRevealed) return;
        cell.isFlagged = !cell.isFlagged;
        cell.el.innerText = cell.isFlagged ? '🚩' : '';
        flags += cell.isFlagged ? 1 : -1;
        updateLCD(mineCountEl, CONFIG[currentDiff].mines - flags);
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timer++;
            updateLCD(timerEl, timer);
        }, 1000);
    }

    function updateLCD(el, val) {
        el.innerText = String(Math.max(0, Math.min(999, val))).padStart(3, '0');
    }

    function checkWin() {
        const { rows, cols, mines } = CONFIG[currentDiff];
        if (revealedCount === rows * cols - mines) {
            gameStatus = 'won';
            clearInterval(timerInterval);
            resetBtn.innerText = '😎';
            // Flag all remaining mines
            minePositions.forEach(pos => {
                const cell = board[pos.r][pos.c];
                if (!cell.isFlagged) {
                    cell.isFlagged = true;
                    cell.el.innerText = '🚩';
                }
            });
            updateLCD(mineCountEl, 0);
        }
    }

    function gameOver() {
        gameStatus = 'lost';
        clearInterval(timerInterval);
        resetBtn.innerText = '😵';
        minePositions.forEach(pos => {
            const cell = board[pos.r][pos.c];
            cell.el.classList.add('revealed', 'mine');
            cell.el.innerText = '💣';
        });
    }

    function reset() {
        initGame(currentDiff);
    }

    initGame('beginner');
</script>

</body>
</html>
