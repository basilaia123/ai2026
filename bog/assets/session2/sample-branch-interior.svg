<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <linearGradient id="wallGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="floorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="woodPanel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="orangeGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f36f21" />
      <stop offset="100%" stop-color="#ff8533" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background / Room Shell -->
  <rect width="1200" height="800" fill="#0a101d" />

  <!-- Ceiling -->
  <polygon points="0,0 1200,0 1050,180 150,180" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
  <!-- Ceiling Linear LED Profiles -->
  <line x1="250" y1="120" x2="950" y2="120" stroke="#f8fafc" stroke-width="6" opacity="0.9" />
  <line x1="300" y1="70" x2="900" y2="70" stroke="#f8fafc" stroke-width="4" opacity="0.7" />

  <!-- Back Wall -->
  <polygon points="150,180 1050,180 1050,550 150,550" fill="url(#wallGrad)" stroke="#334155" stroke-width="2" />

  <!-- Left Perspective Wall with Oak Slats -->
  <polygon points="0,0 150,180 150,550 0,800" fill="#141d2e" />
  <!-- Oak Feature Wall Panels on Left -->
  <polygon points="20,120 140,190 140,530 20,680" fill="url(#woodPanel)" opacity="0.95" />
  <line x1="45" y1="210" x2="45" y2="650" stroke="#78350f" stroke-width="3" />
  <line x1="75" y1="200" x2="75" y2="610" stroke="#78350f" stroke-width="3" />
  <line x1="105" y1="195" x2="105" y2="570" stroke="#78350f" stroke-width="3" />

  <!-- Right Perspective Wall with Glass Partition -->
  <polygon points="1200,0 1050,180 1050,550 1200,800" fill="#0b1324" />
  <polygon points="1060,200 1180,90 1180,720 1060,540" fill="#0284c7" opacity="0.15" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="1120" y1="145" x2="1120" y2="630" stroke="#38bdf8" stroke-width="1.5" opacity="0.6" />

  <!-- Floor Tiles (60x120 perspective grid) -->
  <polygon points="150,550 1050,550 1200,800 0,800" fill="url(#floorGrad)" />
  <line x1="150" y1="550" x2="0" y2="800" stroke="#475569" stroke-width="2" />
  <line x1="1050" y1="550" x2="1200" y2="800" stroke="#475569" stroke-width="2" />
  <line x1="330" y1="550" x2="200" y2="800" stroke="#475569" stroke-width="1.5" opacity="0.7" />
  <line x1="510" y1="550" x2="450" y2="800" stroke="#475569" stroke-width="1.5" opacity="0.7" />
  <line x1="690" y1="550" x2="750" y2="800" stroke="#475569" stroke-width="1.5" opacity="0.7" />
  <line x1="870" y1="550" x2="1000" y2="800" stroke="#475569" stroke-width="1.5" opacity="0.7" />
  <line x1="75" y1="630" x2="1125" y2="630" stroke="#475569" stroke-width="1.5" opacity="0.7" />
  <line x1="30" y1="710" x2="1170" y2="710" stroke="#475569" stroke-width="1.5" opacity="0.7" />

  <!-- Center Feature: Solo Lounge Wall Artwork / Wayfinding Board -->
  <rect x="420" y="240" width="360" height="180" rx="8" fill="#162032" stroke="#334155" stroke-width="2" />
  <rect x="420" y="240" width="360" height="6" rx="3" fill="url(#orangeGlow)" />
  <text x="600" y="325" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="3">SOLO LOUNGE</text>
  <text x="600" y="360" fill="#94a3b8" font-family="Arial, sans-serif" font-size="13" text-anchor="middle">CONCEPT VISUALIZATION · ZONE B-02</text>
  <circle cx="600" cy="385" r="3" fill="#f36f21" />

  <!-- Furniture: Premium Armchairs & Low Coffee Table -->
  <!-- Table -->
  <ellipse cx="600" cy="620" rx="90" ry="32" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <ellipse cx="600" cy="615" rx="80" ry="26" fill="#1e293b" />
  <rect x="590" y="620" width="20" height="40" fill="#0f172a" />

  <!-- Left Armchair -->
  <path d="M 330 520 Q 370 510 410 520 L 420 590 Q 370 610 320 590 Z" fill="#334155" stroke="#f36f21" stroke-width="2" />
  <ellipse cx="370" cy="570" rx="45" ry="25" fill="#475569" />

  <!-- Right Armchair -->
  <path d="M 790 520 Q 830 510 870 520 L 880 590 Q 830 610 780 590 Z" fill="#334155" stroke="#f36f21" stroke-width="2" />
  <ellipse cx="830" cy="570" rx="45" ry="25" fill="#475569" />

  <!-- Ambient Light Reflection on Floor -->
  <ellipse cx="600" cy="660" rx="280" ry="60" fill="#f36f21" opacity="0.08" filter="url(#softGlow)" />

  <!-- HUD Overlay / Inspection Badge -->
  <rect x="30" y="30" width="310" height="75" rx="10" fill="#0a101d" opacity="0.9" stroke="#f36f21" stroke-width="1.5" />
  <circle cx="55" cy="55" r="8" fill="#10b981" />
  <text x="75" y="52" fill="#f8fafc" font-family="Arial, sans-serif" font-size="13" font-weight="bold">BOG ARCHITECTURAL CONCEPT</text>
  <text x="75" y="72" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">MODEL: FLUX / KREA · 3000K WARM LED</text>
  <text x="75" y="90" fill="#f36f21" font-family="Arial, sans-serif" font-size="10" font-weight="bold">GREEN ZONE: SANITIZED MOCKUP</text>
</svg>
