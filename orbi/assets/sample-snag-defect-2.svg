<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="tileA" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="tileB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f4c6b" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="tileDrop">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Floor Surface -->
  <rect width="900" height="650" fill="#0f172a" />

  <!-- Tile 1 (Left Tile - Slightly Higher Plane) -->
  <rect x="50" y="90" width="380" height="470" rx="2" fill="url(#tileA)" stroke="#1e293b" stroke-width="2" filter="url(#tileDrop)" />
  <!-- Porcelain Marble Texture Veins -->
  <path d="M 80 120 Q 150 200 240 220 T 380 340" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.4" />
  <path d="M 120 400 Q 200 450 310 440" fill="none" stroke="#64748b" stroke-width="1" opacity="0.3" />

  <!-- Tile 2 (Right Tile - Slightly Lower Plane - Demonstrating Lippage) -->
  <rect x="440" y="90" width="410" height="470" rx="2" fill="url(#tileB)" stroke="#1e293b" stroke-width="2" />
  <path d="M 460 140 Q 550 220 680 200 T 820 310" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.4" />

  <!-- Grout Line (Uneven Epoxy Joint) -->
  <rect x="430" y="90" width="10" height="470" fill="#090d16" />
  <!-- Sunk-in Grout Depressions -->
  <rect x="431" y="160" width="8" height="90" fill="#ef4444" opacity="0.3" />
  <rect x="431" y="320" width="8" height="120" fill="#ef4444" opacity="0.3" />

  <!-- Chipped Tile Corner Defect (Chip on Right Tile Corner) -->
  <path d="M 440 250 L 452 258 L 448 275 L 440 268 Z" fill="#f87171" stroke="#b91c1c" stroke-width="1.5" />
  <circle cx="445" cy="262" r="18" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Restroom Floor Drain (Trape) near edge -->
  <g transform="translate(620, 360)">
    <circle cx="60" cy="60" r="55" fill="#1e293b" stroke="#94a3b8" stroke-width="3" />
    <circle cx="60" cy="60" r="45" fill="#0f172a" stroke="#cbd5e1" stroke-width="2" />
    <!-- Perforated Grate Pattern -->
    <circle cx="45" cy="45" r="4" fill="#94a3b8" />
    <circle cx="60" cy="45" r="4" fill="#94a3b8" />
    <circle cx="75" cy="45" r="4" fill="#94a3b8" />
    <circle cx="45" cy="60" r="4" fill="#94a3b8" />
    <circle cx="60" cy="60" r="4" fill="#94a3b8" />
    <circle cx="75" cy="60" r="4" fill="#94a3b8" />
    <circle cx="45" cy="75" r="4" fill="#94a3b8" />
    <circle cx="60" cy="75" r="4" fill="#94a3b8" />
    <circle cx="75" cy="75" r="4" fill="#94a3b8" />
  </g>

  <!-- Lippage Measurement Gauge Tool Callout -->
  <g transform="translate(320, 150)">
    <rect x="0" y="0" width="180" height="40" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2" filter="url(#tileDrop)" />
    <text x="90" y="24" fill="#854d0e" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">LIPPAGE: ~3.2 mm</text>
    <line x1="90" y1="40" x2="110" y2="70" stroke="#ca8a04" stroke-width="2" />
    <circle cx="110" cy="70" r="3" fill="#ca8a04" />
  </g>

  <!-- Defect Annotation 1: Lippage & Grout -->
  <g transform="translate(80, 280)">
    <rect x="0" y="0" width="230" height="95" rx="8" fill="#0f172a" stroke="#f36f21" stroke-width="2" filter="url(#tileDrop)" />
    <text x="12" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">DEFECT ID: SNAG-03A</text>
    <text x="12" y="44" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">TILE LIPPAGE (>2 mm)</text>
    <text x="12" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="10">Height delta exceeds tolerance</text>
    <text x="12" y="78" fill="#f59e0b" font-family="sans-serif" font-size="9">Action: Re-lay tile with level clips</text>
    <line x1="230" y1="48" x2="430" y2="180" stroke="#f36f21" stroke-width="2" stroke-linecap="round" />
    <circle cx="430" cy="180" r="4" fill="#f36f21" />
  </g>

  <!-- Defect Annotation 2: Chipped Corner -->
  <g transform="translate(560, 180)">
    <rect x="0" y="0" width="220" height="85" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="2" filter="url(#tileDrop)" />
    <text x="12" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">DEFECT ID: SNAG-03B</text>
    <text x="12" y="44" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">CHIPPED CORNER</text>
    <text x="12" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="10">Dimension: 5x8 mm chipped edge</text>
    <text x="12" y="76" fill="#f87171" font-family="sans-serif" font-size="9">Priority: High · Replace tile</text>
    <line x1="0" y1="50" x2="-95" y2="80" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <circle cx="-95" cy="80" r="4" fill="#ef4444" />
  </g>

  <!-- Technical Overlay Bar (Top) -->
  <rect x="25" y="25" width="850" height="45" rx="8" fill="#0a101d" opacity="0.92" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="52" fill="#f36f21" font-family="sans-serif" font-size="14" font-weight="black">BOG QA/QC FIELD INSPECTION</text>
  <text x="320" y="52" fill="#94a3b8" font-family="sans-serif" font-size="12">LOCATION: RESTROOM 02 FLOOR</text>
  <text x="620" y="52" fill="#10b981" font-family="monospace" font-size="12">SANITIZED: GREEN TIER</text>

  <!-- Bottom Metadata Bar -->
  <rect x="25" y="585" width="850" height="40" rx="8" fill="#0a101d" opacity="0.92" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="610" fill="#94a3b8" font-family="monospace" font-size="11">INSPECTOR: QA_LEAD_01 · PORCELAIN 60x120 · DRAIN JUNCTION · MACRO INSPECTION</text>
</svg>
