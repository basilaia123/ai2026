<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" width="100%" height="100%">
  <defs>
    <linearGradient id="wallTexture" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background: Drywall Surface Finish -->
  <rect width="900" height="650" fill="url(#wallTexture)" />

  <!-- Inspection Grid Lines (Subtle) -->
  <g stroke="#ffffff" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="150" x2="900" y2="150" />
    <line x1="0" y1="300" x2="900" y2="300" />
    <line x1="0" y1="450" x2="900" y2="450" />
    <line x1="225" y1="0" x2="225" y2="650" />
    <line x1="450" y1="0" x2="450" y2="650" />
    <line x1="675" y1="0" x2="675" y2="650" />
  </g>

  <!-- Drywall Seam Joint (Vertical Tape Defect) -->
  <line x1="450" y1="80" x2="450" y2="580" stroke="#475569" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6" />

  <!-- The Actual Crack / Blister on Joint Tape -->
  <path d="M 450 140 Q 456 200 447 250 T 455 330 T 444 410 T 452 480 T 450 540" 
        fill="none" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" filter="url(#shadow)" />
  <!-- Micro Fissures branching out -->
  <path d="M 447 250 Q 435 270 425 285" fill="none" stroke="#1e293b" stroke-width="2.5" />
  <path d="M 455 330 Q 468 355 480 370" fill="none" stroke="#1e293b" stroke-width="2.5" />
  <path d="M 444 410 Q 430 425 418 435" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Tape Delamination Bubble Outline -->
  <ellipse cx="452" cy="335" rx="22" ry="70" fill="#f8fafc" opacity="0.18" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Measurement Overlay: Inspector Metric Ruler (450 mm scale) -->
  <g transform="translate(510, 140)">
    <!-- Ruler body -->
    <rect x="0" y="0" width="45" height="400" rx="4" fill="#fef08a" stroke="#ca8a04" stroke-width="2" />
    <!-- Ruler Marks -->
    <line x1="0" y1="20" x2="20" y2="20" stroke="#000" stroke-width="2" />
    <text x="24" y="25" font-family="monospace" font-size="11" font-weight="bold">0 cm</text>
    <line x1="0" y1="100" x2="16" y2="100" stroke="#000" stroke-width="1.5" />
    <text x="22" y="105" font-family="monospace" font-size="10">10 cm</text>
    <line x1="0" y1="200" x2="16" y2="200" stroke="#000" stroke-width="1.5" />
    <text x="22" y="205" font-family="monospace" font-size="10">20 cm</text>
    <line x1="0" y1="300" x2="16" y2="300" stroke="#000" stroke-width="1.5" />
    <text x="22" y="305" font-family="monospace" font-size="10">30 cm</text>
    <line x1="0" y1="380" x2="20" y2="380" stroke="#000" stroke-width="2" />
    <text x="24" y="385" font-family="monospace" font-size="11" font-weight="bold">45 cm</text>
  </g>

  <!-- Red Target Focus Box -->
  <rect x="390" y="210" width="120" height="250" rx="6" fill="none" stroke="#ef4444" stroke-width="3" stroke-dasharray="8,6" />
  <circle cx="390" cy="210" r="4" fill="#ef4444" />
  <circle cx="510" cy="210" r="4" fill="#ef4444" />
  <circle cx="390" cy="460" r="4" fill="#ef4444" />
  <circle cx="510" cy="460" r="4" fill="#ef4444" />

  <!-- Annotation Marker Callout -->
  <g transform="translate(140, 240)">
    <rect x="0" y="0" width="220" height="85" rx="8" fill="#0f172a" stroke="#f36f21" stroke-width="2" filter="url(#shadow)" />
    <text x="12" y="24" fill="#f8fafc" font-family="sans-serif" font-size="12" font-weight="bold">DEFECT ID: SNAG-01</text>
    <text x="12" y="44" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">VERICAL JOINT CRACK</text>
    <text x="12" y="62" fill="#cbd5e1" font-family="sans-serif" font-size="10">Length: ~45 cm · Drywall seam</text>
    <text x="12" y="76" fill="#f59e0b" font-family="sans-serif" font-size="9">Priority: Medium · Tape delam</text>
    <line x1="220" y1="42" x2="390" y2="310" stroke="#f36f21" stroke-width="2" stroke-linecap="round" />
    <circle cx="390" cy="310" r="4" fill="#f36f21" />
  </g>

  <!-- Technical Overlay Bar (Top) -->
  <rect x="25" y="25" width="850" height="45" rx="8" fill="#0a101d" opacity="0.92" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="52" fill="#f36f21" font-family="sans-serif" font-size="14" font-weight="black">ORBI QA/QC FIELD INSPECTION</text>
  <text x="320" y="52" fill="#94a3b8" font-family="sans-serif" font-size="12">LOCATION: CASHIER ZONE W-02</text>
  <text x="620" y="52" fill="#10b981" font-family="monospace" font-size="12">SANITIZED: GREEN TIER</text>

  <!-- Bottom Metadata Bar -->
  <rect x="25" y="585" width="850" height="40" rx="8" fill="#0a101d" opacity="0.92" stroke="#334155" stroke-width="1.5" />
  <text x="45" y="610" fill="#94a3b8" font-family="monospace" font-size="11">CAM: FIELD_MOBILE_03 · TIME: 11:24:08 · ISO 200 · F/2.4 · MACRO INSPECTION</text>
</svg>
