<!DOCTYPE html>
<html lang="ka">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ლექცია 8: ფინალური პროექტები | AI პრაქტიკაში</title>
    <link href="https://cdn.jsdelivr.net/gh/Loopple/FiraGO@1.0/cdn/FiraGO.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'FiraGO', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #2c3e50;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .card {
            background: rgba(255, 255, 255, 0.98);
            padding: 3rem 2rem;
            border-radius: 20px;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.2);
        }
        .icon { font-size: 3.5rem; margin-bottom: 1rem; }
        h1 { color: #667eea; font-size: 2rem; margin-bottom: 1rem; }
        p { font-size: 1.15rem; color: #4a5568; margin-bottom: 1.5rem; }
        .info-box {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            padding: 1rem 1.2rem;
            border-radius: 8px;
            text-align: left;
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }
        .btn-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
        .btn {
            display: inline-block;
            padding: 0.85rem 1.8rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4); }
        .btn-outline {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }
        .btn-outline:hover { background: #667eea; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🚀</div>
        <h1>8-შეხვედრიანი კურსის ფორმატი</h1>
        <p>
            განახლებულ 8-შეხვედრიან პროგრამაში სულ გვაქვს <strong>7 საშინაო დავალება (50 ქულა)</strong>.<br>
            მე-8 შეხვედრა ეთმობა <strong>ფინალური Capstone პროექტების პრეზენტაციას (25 ქულა)</strong>.
        </p>
        <div class="info-box">
            💡 გადამისამართება ხდება ფინალური პროექტების გვერდზე 3 წამში...
        </div>
        <div class="btn-group">
            <a href="final-project-ideas.html" class="btn">💡 ფინალური პროექტების იდეები</a>
            <a href="index.html" class="btn btn-outline">🏠 მთავარი გვერდი</a>
        </div>
    </div>
</body>
</html>
